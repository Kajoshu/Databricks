resources:
  pipelines:
    medallionpipeline:
      name: MedallionPipeline
      libraries:
        - glob:
            include: ../src/MedallionPipeline/transformations/**
      configuration:
        silver_schema: joshuandegwa_silver
        gold_schema: joshuandegwa_gold
      catalog: dbr_dev
      channel: CURRENT
      continuous: false
      environment:
        dependencies:
          - geopy==2.4.1
      photon: true
      root_path: ../src/MedallionPipeline
      schema: joshuandegwa_bronze
      serverless: true
