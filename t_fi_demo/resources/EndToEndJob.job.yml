resources:
  jobs:
    EndToEndJob:
      name: "End-to-End Pipeline"
      queue:
        enabled: true
      schedule:
        quartz_cron_expression: "0 0 22 * * ?"
        timezone_id: "UTC"
      tasks:
        # 1. R2 Ingest Pipeline (Parallel)
        - task_key: r2_ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.IngestR2StorageB.id}

        # 2. Telemetry Ingest Pipeline (Parallel)
        - task_key: TelemetryIngest
          pipeline_task:
            pipeline_id: ${resources.pipelines.telemetryIngestionB.id}

        # 3. Postgres Ingest Job (Parallel)
        - task_key: PostgresIngest
          run_job_task:
            job_id: ${resources.jobs.postgresingestion_job.id}

        # 4. Downstream Medallion Pipeline (Waits for all three above)
        - task_key: MedallionETL
          depends_on:
            - task_key: r2_ingest
            - task_key: TelemetryIngest
            - task_key: PostgresIngest
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallionpipeline.id}
        # 5. NEW: ML Inference & Rules (Runs right after MedallionETL finishes)
        - task_key: MLInferenceAndRules
          depends_on:
            - task_key: MedallionETL
          spark_python_task:
            python_file: ../src/run_pipeline_and_ml.py
          existing_cluster_id: "1003-134810-h8i9txnm"
          libraries:
            - pypi:
                package: transformers==4.49.0
            - pypi:
                package: torchvision==0.20.1
            - pypi:
                package: accelerate==1.4.0
            - pypi:
                package: evaluate
            - pypi:
                package: datasets==2.20.0
            - pypi:
                package: mlflow==2.20.2
            - pypi:
                package: flash-attn
