bundle:
  name: "Lab5_Bundle"

# Declare customizable variables for the bundle
variables:
  env_catalog:
    description: "The target catalog based on environment"
    default: "workspace"
  schema_prefix:
    description: "Prefix for schemas"
    default: "lab5"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d6616b16-db43.cloud.databricks.com
    # Uses default "workspace" catalog

  prod:
    mode: production
    workspace:
      host: https://dbc-d6616b16-db43.cloud.databricks.com
      root_path: /Users/josurekamotho@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: josurekamotho@gmail.com
    variables:
      env_catalog: "dbr_dev" # Automatically swaps to dbr_dev for production targets


