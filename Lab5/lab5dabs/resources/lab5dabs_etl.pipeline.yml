# The main pipeline for lab5dabs

resources:
  pipelines:
    lab5dabs_etl:
      name: lab5dabs_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      # root_path: /Workspace/Users/josurekamotho@gmail.com/Databricks/Lab5

      libraries:
        - notebook:
            path: ../src/flight_lakeflow_pipeline_Declarative_Pipelines.py
      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
      configuration:
        BRONZE_SCHEMA: joshuandegwa_bronze
        CATALOG: workspace
        GOLD_SCHEMA: joshuandegwa_gold
        SILVER_SCHEMA: joshuandegwa_silver
